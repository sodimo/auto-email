# One-time (and re-runnable) Cloudflare resource setup. Run this BEFORE the
# first deploy:  gh workflow run bootstrap.yml
#
# It creates the `auto-email` D1 database if it does not exist, resolves its
# uuid, applies every migration in migrations/ to the REMOTE database, and
# commits the uuid into wrangler.jsonc so deploys stop using the placeholder.
# Re-running it is safe: creation is tolerated as already-done and D1 migrations
# are tracked, so applied ones are skipped.
#
# Uses the org-level CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets, which
# are inherited automatically. Nothing here runs from a developer machine.
name: bootstrap
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Create the D1 database (tolerated if it already exists)
        run: |
          npx wrangler d1 create auto-email || echo "::notice::d1 create returned non-zero — assuming it already exists"

      - name: Resolve database_id
        id: d1
        run: |
          set -euo pipefail
          # 'd1 info <name>' resolves through wrangler.jsonc and hits the placeholder
          # database_id; 'd1 list' queries the account by name and is config-independent.
          LIST=$(npx wrangler d1 list --json)
          ID=$(printf '%s' "$LIST" | sed -n '/^[[:space:]]*\[/,$p' | jq -r '.[] | select(.name == "auto-email") | .uuid // .database_id' | head -1)
          if [ -z "$ID" ]; then
            echo "::error::could not find database 'auto-email' in 'wrangler d1 list --json'"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "::notice::auto-email database_id = $ID"

      - name: Point wrangler.jsonc at the real database
        run: sed -i "s|PLACEHOLDER-RUN-BOOTSTRAP-WORKFLOW|${{ steps.d1.outputs.id }}|" wrangler.jsonc

      - name: Apply migrations to the remote database
        run: npx wrangler d1 migrations apply auto-email --remote

      - name: Commit the database_id so deploys stop using the placeholder
        run: |
          set -euo pipefail
          if git diff --quiet -- wrangler.jsonc; then
            echo "::notice::wrangler.jsonc already carried the real database_id — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record auto-email D1 database_id" -- wrangler.jsonc
          git push origin HEAD:main || {
            echo "::error::could not push. Apply this by hand and commit:"
            echo "::error::sed -i 's|PLACEHOLDER-RUN-BOOTSTRAP-WORKFLOW|${{ steps.d1.outputs.id }}|' wrangler.jsonc"
            exit 1
          }

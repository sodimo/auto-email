# Deploy the Worker to the Sodimo Cloudflare account.
#
# PREREQUISITE: run bootstrap.yml first. It creates the D1 database and commits
# its uuid into wrangler.jsonc; deploying with the placeholder still in place
# fails fast in the guard step below.
#
# Auto-deploy on push to main is gated on the repo variable DEPLOY_ENABLED=true
# (`gh variable set DEPLOY_ENABLED --body true`) so the first pushes cannot
# deploy into a half-provisioned account. A manual run always deploys.
#
# The custom domain auto-email.sodimo.eu is attached at the ACCOUNT level by
# attach-domain.yml (Workers Domains API), not declared as a zone `route` here.
# Domain setup and routine code deployment intentionally have separate
# permission and failure boundaries.
name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Refuse to deploy against the placeholder database_id
        run: |
          if grep -q PLACEHOLDER-RUN-BOOTSTRAP-WORKFLOW wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the placeholder database_id — run bootstrap.yml first"
            exit 1
          fi

      - name: D1 migrations (separate step so failures are attributable)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply auto-email --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Runs AFTER deploy: `wrangler secret put` needs the Worker to exist.
      # Re-putting an unchanged secret is a no-op from the operator's side.
      - name: Sync Worker secrets from repo secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRATO_SMTP_PASSWORD: ${{ secrets.STRATO_SMTP_PASSWORD }}
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${STRATO_SMTP_PASSWORD:-}" ]; then
            printf '%s' "$STRATO_SMTP_PASSWORD" | npx wrangler secret put STRATO_SMTP_PASSWORD
          else
            echo "::error::repo secret STRATO_SMTP_PASSWORD is not set — the Worker cannot send mail"
            exit 1
          fi
          if [ -n "${TRIGGER_TOKEN:-}" ]; then
            printf '%s' "$TRIGGER_TOKEN" | npx wrangler secret put TRIGGER_TOKEN
          else
            echo "::error::repo secret TRIGGER_TOKEN is not set — /trigger and /healthz will answer 503."
            echo "::error::Set it with:  gh secret set TRIGGER_TOKEN --body \"\$(openssl rand -hex 32)\""
            exit 1
          fi
